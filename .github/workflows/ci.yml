name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ci-ingest-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: leandroAmariles/shoplab-ci/.github/workflows/python-service.yml@v1
    with:
      python-version: '3.12'
      coverage-threshold: 80
      image-name: 'ghcr.io/leandroamariles/ingest'
      publish-image: ${{ github.ref == 'refs/heads/main' }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
